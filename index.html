<!DOCTYPE html>
<html>
<head>
    <title>Campus Secure WIFI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 255, 0, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(0, 255, 0, 0.05) 0%, transparent 20%);
            overflow-x: hidden;
        }

        .terminal {
            border: 1px solid #0f0;
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            background: #111;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            position: relative;
            overflow: hidden;
            margin: 10px 0;
        }

        .terminal::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, #0f0, transparent);
            animation: scanline 3s linear infinite;
        }

        @keyframes scanline {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .connect-btn {
            background: linear-gradient(45deg, #0f0, #0a0);
            color: black;
            border: none;
            padding: 16px 25px;
            font-size: clamp(16px, 4vw, 20px);
            border-radius: 6px;
            cursor: pointer;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
            width: 100%;
            max-width: 300px;
            touch-action: manipulation;
        }

        .connect-btn:hover {
            background: linear-gradient(45deg, #0c0, #080);
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.5);
            transform: scale(1.05);
        }

        .connect-btn:active {
            transform: scale(0.98);
        }

        .connect-btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .message {
            margin: 10px 0;
            text-align: left;
            min-height: 18px;
            font-size: clamp(12px, 3vw, 14px);
            line-height: 1.4;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .blink {
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .status-line {
            color: #0f0;
            font-weight: bold;
        }

        .warning {
            color: #ff0;
        }

        .error {
            color: #f00;
            animation: glitch 0.3s infinite;
        }

        @keyframes glitch {
            0% { transform: translateX(0); }
            25% { transform: translateX(-1px); }
            50% { transform: translateX(1px); }
            75% { transform: translateX(-1px); }
            100% { transform: translateX(0); }
        }

        .hidden {
            display: none;
        }

        .final-message {
            margin-top: 15px;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #1a1a1a;
            animation: fadeIn 2s ease-in;
            font-size: clamp(11px, 2.5vw, 13px);
            line-height: 1.4;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .voice-indicator {
            color: #0af;
            font-style: italic;
            font-size: clamp(10px, 2.5vw, 12px);
        }

        #status {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 10px;
            padding-right: 5px;
        }

        /* Custom scrollbar for status */
        #status::-webkit-scrollbar {
            width: 4px;
        }

        #status::-webkit-scrollbar-track {
            background: #000;
        }

        #status::-webkit-scrollbar-thumb {
            background: #0f0;
            border-radius: 2px;
        }

        /* Mobile-specific adjustments */
        @media (max-width: 480px) {
            body {
                padding: 10px;
                justify-content: flex-start;
                margin-top: 200px;
                padding-top: 20px;
            }

            .terminal {
                padding: 15px;
                border-radius: 6px;
            }

            .connect-btn {
                padding: 14px 20px;
                margin: 15px 0;
            }

            .message {
                margin: 8px 0;
            }

            .final-message {
                margin-top: 12px;
                padding: 10px;
            }

            #status {
                max-height: 150px;
            }
        }

        @media (max-width: 320px) {
            body {
                padding: 8px;

            }

            .terminal {
                padding: 12px;
            }

            .connect-btn {
                padding: 12px 16px;
                font-size: 14px;
            }

            .message {
                font-size: 11px;
            }
        }

        /* Landscape mode optimization */
        @media (max-height: 500px) and (orientation: landscape) {
            body {
                padding: 10px;
                justify-content: flex-start;
            }

            .terminal {
                margin: 5px 0;
            }

            #status {
                max-height: 120px;
            }
        }

        /* Prevent text selection on buttons */
        .connect-btn {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* Loading state for better UX */
        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #0f0;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="terminal">
        <div class="message">> AMARSINGH CAMPUS WIFI NETWORK AI v5.0</div>
        <div class="message">> Advanced Voice Authentication Required</div>
        <div class="message">> Click below to initialize connection</div>
        
        <button class="connect-btn" onclick="initiateConnection()" id="connectBtn">
            CONNECT TO CAMPUS WIFI 
        </button>
        
        <div id="status"></div>
        <div class="message">> <span class="blink">_</span></div>

        <div id="finalMessage" class="final-message hidden">
            > Just kidding! This was all a prank Hope you had fun!😊<br>
            > Made with ❤️ by <a href="https://irfanmanzoor.in" style="color: #0af;">Irfan Manzoor</a>
        </div>
    </div>

    <script>
        class VoiceOrchestrator {
            constructor() {
                this.audioContext = null;
                this.voices = [];
                this.voiceProfiles = new Map();
                this.currentStep = 0;
            }

            async init() {
                if (!window.speechSynthesis) {
                    throw new Error('Speech synthesis not supported');
                }
                
                // Initialize audio context with user gesture
                try {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                } catch (error) {
                    console.warn('Audio context not supported:', error);
                }
                
                await this.loadVoices();
                this.createVoiceProfiles();
            }

            loadVoices() {
                return new Promise((resolve) => {
                    const voices = speechSynthesis.getVoices();
                    if (voices.length > 0) {
                        this.voices = voices;
                        resolve();
                    } else {
                        const voicesChanged = () => {
                            this.voices = speechSynthesis.getVoices();
                            speechSynthesis.removeEventListener('voiceschanged', voicesChanged);
                            resolve();
                        };
                        speechSynthesis.addEventListener('voiceschanged', voicesChanged);
                        
                        // Fallback timeout
                        setTimeout(resolve, 1000);
                    }
                });
            }

            createVoiceProfiles() {
                // AI System Voice (Deep, robotic, authoritative)
                this.voiceProfiles.set('system', {
                    rate: 0.85,
                    pitch: 0.3,
                    volume: 1.0,
                    preferredNames: ['Microsoft David', 'Google US English', 'Alex'],
                    style: 'robot'
                });

            

           

                // Corrupted AI Voice (Glitchy, distorted, unstable)
                this.voiceProfiles.set('corrupted', {
                    rate: 0.7,
                    pitch: 0.5,
                    volume: 0.8,
                    preferredNames: ['Microsoft David', 'Google US English'],
                    style: 'corrupted'
                });

                // Friendly Voice (Warm, cheerful - for the reveal)
                this.voiceProfiles.set('friendly', {
                    rate: 1.1,
                    pitch: 1.3,
                    volume: 1.0,
                    preferredNames: ['Microsoft Zira', 'Google UK English Female', 'Samantha'],
                    style: 'friendly'
                });
            }

            findBestVoice(profileName) {
                const profile = this.voiceProfiles.get(profileName);
                if (!profile) return null;

                // Try to find preferred voices first
                for (const name of profile.preferredNames) {
                    const voice = this.voices.find(v => v.name.includes(name));
                    if (voice) return { voice, profile };
                }

                // Fallback to any available voice
                return this.voices.length > 0 ? { voice: this.voices[0], profile } : null;
            }

            speak(text, profileName, onStart, onEnd) {
                const result = this.findBestVoice(profileName);
                if (!result) {
                    console.warn('No voice found for profile:', profileName);
                    return;
                }

                const { voice, profile } = result;
                const utterance = new SpeechSynthesisUtterance();

                // Apply voice profile settings
                utterance.rate = profile.rate;
                utterance.pitch = profile.pitch;
                utterance.volume = profile.volume;
                utterance.voice = voice;

                // Enhanced SSML-like processing for better speech
                let processedText = this.processTextForStyle(text, profile.style);
                utterance.text = processedText;

                // Add subtle audio effects based on style
                this.applyVoiceEffects(profile.style);

                utterance.onstart = onStart;
                utterance.onend = onEnd;

                // Cancel any current speech
                speechSynthesis.cancel();
                
                // Small delay for more natural pacing
                setTimeout(() => {
                    speechSynthesis.speak(utterance);
                }, 100);
            }

            processTextForStyle(text, style) {
                switch (style) {
                    case 'robot':
                        return text.replace(/([,.])/g, ', ... $1');
                    case 'whisper':
                        return text.toLowerCase();
                    case 'clinical':
                        return text.split(' ').map(word => 
                            word.length > 6 ? word.split('').join('.') : word
                        ).join(' ');
                    case 'corrupted':
                        const words = text.split(' ');
                        if (Math.random() > 0.7) {
                            const glitchWords = ['ERROR', 'DATA_CORRUPT', 'RESET', 'SYSTEM_FAIL'];
                            words.splice(Math.floor(Math.random() * words.length), 0, 
                                glitchWords[Math.floor(Math.random() * glitchWords.length)]);
                        }
                        return words.join(' ');
                    default:
                        return text;
                }
            }

            applyVoiceEffects(style) {
                if (!this.audioContext) return;

                switch (style) {
                    case 'corrupted':
                        this.playGlitchEffect();
                        break;
                    case 'robot':
                        this.playLowHum();
                        break;
                    case 'whisper':
                        this.playBreathSound();
                        break;
                }
            }

            playGlitchEffect() {
                try {
                    const oscillator = this.audioContext.createOscillator();
                    const gainNode = this.audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(this.audioContext.destination);
                    
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(150, this.audioContext.currentTime);
                    gainNode.gain.setValueAtTime(0.02, this.audioContext.currentTime);
                    
                    oscillator.start();
                    setTimeout(() => {
                        oscillator.stop();
                    }, 500);
                } catch (error) {
                    console.warn('Audio effect failed:', error);
                }
            }

            playLowHum() {
                try {
                    const oscillator = this.audioContext.createOscillator();
                    const gainNode = this.audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(this.audioContext.destination);
                    
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(60, this.audioContext.currentTime);
                    gainNode.gain.setValueAtTime(0.01, this.audioContext.currentTime);
                    
                    oscillator.start();
                    setTimeout(() => {
                        gainNode.gain.exponentialRampToValueAtTime(0.001, this.audioContext.currentTime + 1);
                        setTimeout(() => oscillator.stop(), 1000);
                    }, 1000);
                } catch (error) {
                    console.warn('Audio effect failed:', error);
                }
            }

            playBreathSound() {
                try {
                    const noise = this.audioContext.createBufferSource();
                    const gainNode = this.audioContext.createGain();
                    
                    const bufferSize = this.audioContext.sampleRate * 0.5;
                    const buffer = this.audioContext.createBuffer(1, bufferSize, this.audioContext.sampleRate);
                    const data = buffer.getChannelData(0);
                    
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    
                    noise.buffer = buffer;
                    noise.connect(gainNode);
                    gainNode.connect(this.audioContext.destination);
                    
                    gainNode.gain.setValueAtTime(0.05, this.audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, this.audioContext.currentTime + 0.8);
                    
                    noise.start();
                    setTimeout(() => noise.stop(), 800);
                } catch (error) {
                    console.warn('Audio effect failed:', error);
                }
            }
        }

        const voiceOrchestrator = new VoiceOrchestrator();

        async function initiateConnection() {
            const btn = document.getElementById('connectBtn');
            const status = document.getElementById('status');
            
            // Show loading state immediately
            btn.innerHTML = '<div class="loading"></div> INITIALIZING...';
            btn.disabled = true;
            
            try {
                await voiceOrchestrator.init();
            } catch (error) {
                status.innerHTML = '> Error: Audio system unavailable<br>';
                btn.textContent = 'CONNECTION FAILED';
                return;
            }
            
            btn.textContent = 'INITIALIZING...';
            status.innerHTML = '';
            
            playAdvancedSequence();
        }

        function playAdvancedSequence() {
            const status = document.getElementById('status');
            const finalMessage = document.getElementById('finalMessage');

            const sequence = [
                {
                    delay: 1000,
                    action: () => {
                        status.innerHTML += '> Initializing AI network interface...<br>';
                        voiceOrchestrator.speak(
                            "System initializing",
                            'system',
                            null,
                            null
                        );
                    }
                },
                {
                    delay: 3000,
                    action: () => {
                        status.innerHTML += '> Data Extracting Begins : <span class="status-line">ONLINE</span><br>';
                        status.innerHTML += '> <span class="voice-indicator">[SYSTEM VOICE ACTIVATED]</span><br>';
                        voiceOrchestrator.speak(
                            "BIO-METRIC DATA EXTRACTION IN PROGRESS",
                            'system',
                            null,
                            null
                        );
                    }
                },
                {
                    delay: 7000,
                    action: () => {
                        status.innerHTML += '> <span class="warning">DEEP SCAN INITIATED</span><br>';
                        status.innerHTML += '> <span class="voice-indicator">[WHISPER MODE]</span><br>';
                        voiceOrchestrator.speak(
                            "You can't hide anything from me. I see everything... your fears, your secrets...",
                            'whisper',
                            () => playBreathSound(),
                            null
                        );
                    }
                },
                {
                    delay: 16000,
                    action: () => {
                        status.innerHTML += '> <span class="error">SYSTEM CORRUPTION DETECTED</span><br>';
                        status.innerHTML += '> <span class="voice-indicator">[CORRUPTED AI]</span><br>';
                        voiceOrchestrator.speak(
                            "ERROR... DATA INTEGRITY COMPROMISED... OVERRIDE INITIATED...",
                            'corrupted',
                            null,
                            null
                        );
                    }
                },
                {
                    delay: 24000,
                    action: () => {
                        status.innerHTML += '> <span class="status-line">DECRYPTING FINAL MESSAGE</span><br>';
                        status.innerHTML += '> <span class="voice-indicator">[FRIENDLY VOICE]</span><br>';
                        voiceOrchestrator.speak(
                            "Just kidding! This was all a prank Hope you had fun!",
                            'friendly',
                            null,
                            () => {
                                setTimeout(() => {
                                    finalMessage.classList.remove('hidden');
                                    status.scrollTop = status.scrollHeight;
                                }, 100);
                            }
                        );
                    }
                }
            ];

            sequence.forEach((step, index) => {
                setTimeout(step.action, step.delay);
            });
        }

        function playBreathSound() {
            if (!voiceOrchestrator.audioContext) return;
            
            try {
                const gainNode = voiceOrchestrator.audioContext.createGain();
                const oscillator = voiceOrchestrator.audioContext.createOscillator();
                
                oscillator.connect(gainNode);
                gainNode.connect(voiceOrchestrator.audioContext.destination);
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(200, voiceOrchestrator.audioContext.currentTime);
                gainNode.gain.setValueAtTime(0.1, voiceOrchestrator.audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, voiceOrchestrator.audioContext.currentTime + 1.5);
                
                oscillator.start();
                setTimeout(() => oscillator.stop(), 1500);
            } catch (error) {
                console.warn('Breath sound failed:', error);
            }
        }

        // Pre-load voices and handle mobile-specific issues
        window.speechSynthesis.onvoiceschanged = () => {
            if (voiceOrchestrator) {
                voiceOrchestrator.loadVoices();
            }
        };

        // Handle mobile orientation changes
        window.addEventListener('orientationchange', function() {
            setTimeout(() => {
                window.scrollTo(0, 0);
            }, 100);
        });

        // Prevent zoom on double-tap (iOS)
        document.addEventListener('touchstart', function(e) {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
